[build-system]
requires = ["setuptools", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rompy-schism"
description = "SCHISM model plugin for rompy"
readme = "README.md"
authors = [{ name = "Rompy Contributors", email = "developers@rompy.com" }]
maintainers = [{ name = "Rompy Contributors", email = "developers@rompy.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = { text = "Apache Software License 2.0" }
requires-python = ">=3.10"
dependencies = [
    "rompy>=0.6",
    "pydantic>2",
    "pylibs-ocean",
    # pyTMD 3 only (constituents, not arguments; extra_databases JSON is
    # model-name keyed with z/u/v groups). pyTMD 2 overlays will not load.
    # Pin main after the 3.0.9 release: that tag still reports version
    # 3.0.9, and PyPI 3.0.9 crops a 0–360 grid with a −180..180 box to
    # nothing and reads the whole dataset. This commit has the lazy
    # dateline-aware crop (pyTMD#613) and ATLAS nodata masking
    # (pyTMD#624, pyTMD#625). Transport is still divided on the model
    # grid (pyTMD#632); bctides undoes that.
    "pytmd @ git+https://github.com/pyTMD/pyTMD.git@60931a4b3a57e65c1444650c973be5e998404d3c",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = ["coverage", "mypy", "pytest", "ruff", "requests"]
test = ["pytest", "coverage", "requests"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]

[project.entry-points."rompy.config"]
schismcsiro = "rompy_schism.config:SchismCSIROConfig"
schism = "rompy_schism.config:SCHISMConfig"

[project.urls]
bugs = "https://github.com/rom-py/rompy-schism/issues"
changelog = "https://github.com/rom-py/rompy-schism/blob/master/changelog.md"
homepage = "https://github.com/rom-py/rompy-schism"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"*" = ["*.y*ml", "*.csv", "*.html"]

[tool.setuptools.dynamic]
version = { attr = "rompy_schism.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--tb=short -v"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.black]
line-length = 88
