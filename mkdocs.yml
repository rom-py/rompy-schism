site_name: rompy-schism
site_description: Configure and run the SCHISM ocean model from Python and YAML
site_url: https://rom-py.github.io/rompy-schism/
repo_url: https://github.com/rom-py/rompy-schism
repo_name: rom-py/rompy-schism
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first model: getting-started/first-model.md
  - User guide:
      - How rompy-schism works: user-guide/how-it-works.md
      - Configuration: user-guide/configuration.md
      - Mesh and vertical grid: user-guide/mesh.md
      - Open boundaries and tides: user-guide/boundaries.md
      - Initial conditions and hotstart: user-guide/initial-conditions.md
      - Atmospheric forcing: user-guide/atmosphere.md
      - Waves with WWM: user-guide/waves.md
      - Model settings: user-guide/model-settings.md
      - Output: user-guide/output.md
      - Running SCHISM: user-guide/running.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Reference:
      - reference/index.md
      - Config: reference/config.md
      - Grid: reference/grid.md
      - Vertical grid: reference/vgrid.md
      - Data: reference/data.md
      - Boundary and initial conditions: reference/boundary.md
      - Atmosphere: reference/atmosphere.md
      - Waves: reference/waves.md
      - param.nml: reference/param.md
      - Namelists: reference/namelists.md
      - WWM: reference/wwminput.md
      - Modules: reference/modules.md
      - Internals: reference/internals.md
      - Namelist index: reference/namelist-index.md

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/rompy.css

extra:
  rompy:
    site: schism

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
            # ROMPY_INVENTORY points local builds at an unpublished rompy site.
            - url: !ENV [ROMPY_INVENTORY, "https://rom-py.github.io/rompy/objects.inv"]
              base_url: https://rom-py.github.io/rompy/
          options:
            docstring_style: auto
            docstring_section_style: table
            preload_modules: [rompy]
            inherited_members: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            group_by_category: true
            summary: false
            filters: ["!^_", "!^model_(?!type$)"]
            extensions:
              - griffe_pydantic: {schema: false}
              - rompy_docs.griffe:PydanticFieldRules

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
